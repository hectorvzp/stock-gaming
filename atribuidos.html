<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Equipamentos Atribuídos — Gear Control</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/styles.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.1/sweetalert2.all.min.js"></script>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">🎮</div>
        <div>
          <h1>Gear Control</h1>
          <p>Estoque de equipamentos gamer</p>
        </div>
      </div>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Estoque Principal</a>
        <a href="atribuidos.html" class="nav-link active">Atribuídos</a>
        <a href="tarefas.html" class="nav-link">Lembretes & Tarefas</a>
      </nav>
    </div>
    <div class="circuit-rule"></div>

    <div class="wrap">
      <div class="panel">
        <div class="panel-head">
          <h2>Equipamentos Atribuídos (Em Uso)</h2>
        </div>
        <div class="panel-body">
          <div class="chips" id="assignedCategoryFilters"></div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Categoria</th>
                  <th>Atribuído Para</th>
                  <th>Data</th>
                  <th>Observação</th>
                  <th>Atlas</th>
                  <th style="width: 160px; text-align: right">Ações</th>
                </tr>
              </thead>
              <tbody id="assignedTableBody"></tbody>
            </table>
          </div>

          <div
            class="empty-state"
            id="assignedEmptyState"
            style="display: none"
          >
            Nenhum equipamento atribuído no momento.
          </div>
        </div>
      </div>
    </div>

    <footer>Gear Control — dados salvos localmente neste navegador</footer>

    <!-- SCRIPT COMO MÓDULO -->
    <script type="module" src="./scripts/app.js"></script>
  </body>
</html>
